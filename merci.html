<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UNIS - Merci</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#eee6f2;
  font-family:Georgia, serif;
  color:#24106b;
}

/* =========================
   PAGE
========================= */

.page{
  width:100%;
  max-width:1030px;
  min-height:100vh;
  margin:0 auto;

  background:#fff;

  padding:20px 35px 30px;

  text-align:center;
}


/* =========================
   LOGO UNIS
========================= */

.logo-unis{
  display:block;

  width:155px;
  max-width:35%;

  height:auto;

  margin:0 auto 18px;
}


/* =========================
   VISUEL MERCI
========================= */

.merci-image{
  display:block;

  width:100%;
  max-width:850px;

  height:auto;

  margin:0 auto;

  border-radius:15px;
}


/* =========================
   BOUTONS
========================= */

.buttons{
  width:100%;
  max-width:700px;

  margin:20px auto 0;

  display:flex;
  flex-direction:column;

  gap:12px;
}


.btn{
  display:block;

  width:100%;

  padding:16px 25px;

  border:2px solid #d9c6a0;
  border-radius:12px;

  background:#f8edda;

  color:#5c421f;

  font-family:Georgia, serif;
  font-size:20px;
  font-weight:bold;

  text-decoration:none;

  cursor:pointer;

  transition:
    transform .15s ease,
    background .15s ease;
}


.btn:hover{
  background:#f3e2c5;
  transform:translateY(-1px);
}


/* =========================
   BOUTON FERMER
========================= */

button.btn{
  appearance:none;
  -webkit-appearance:none;
}


/* =========================
   MESSAGE SI LE NAVIGATEUR
   REFUSE DE FERMER LA PAGE
========================= */

.close-message{
  display:none;

  margin:12px auto 0;

  max-width:650px;

  font-family:Arial, sans-serif;
  font-size:14px;
  line-height:1.4;

  color:#6d5b78;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .page{
    padding:15px 12px 25px;
  }

  .logo-unis{
    width:125px;
    max-width:40%;
    margin-bottom:14px;
  }

  .merci-image{
    border-radius:10px;
  }

  .buttons{
    margin-top:15px;
    gap:10px;
  }

  .btn{
    padding:14px 15px;
    font-size:17px;
  }

}

</style>

</head>


<body>


<main class="page">


  <!-- =========================
       LOGO UNIS
  ========================= -->

  <img
    src="logoUNIS.png"
    class="logo-unis"
    alt="UNIS"
  >


  <!-- =========================
       IMAGE DE REMERCIEMENT
  ========================= -->

  <img
    src="merci.png"
    class="merci-image"
    alt="Ta voix est là. Merci d’avoir été là."
  >


  <!-- =========================
       BOUTONS
  ========================= -->

  <div class="buttons">


    <!-- FERMER LA PAGE -->

    <button
      type="button"
      class="btn"
      id="closeBtn"
    >
      Tu peux maintenant refermer cette page
    </button>


    <!-- TÉMOIGNAGES -->

    <a
      href="temoignages.html"
      class="btn"
    >
      Découvrir les témoignages
    </a>


  </div>


  <div
    class="close-message"
    id="closeMessage"
  >
    Ton navigateur ne permet pas de fermer automatiquement cette page.
    Tu peux simplement fermer cet onglet.
  </div>


</main>


<script>

/* =========================
   FERMETURE DE LA PAGE
========================= */

const closeBtn =
  document.getElementById("closeBtn");

const closeMessage =
  document.getElementById("closeMessage");


closeBtn.addEventListener(
  "click",
  () => {

    /*
      Les navigateurs autorisent généralement
      window.close() uniquement lorsqu'une page
      a été ouverte par JavaScript.

      On tente donc la fermeture.
    */

    window.close();


    /*
      Si la page est toujours ouverte,
      on affiche une petite indication.
    */

    setTimeout(
      () => {

        closeMessage.style.display =
          "block";

      },
      300
    );

  }
);

</script>


</body>

</html>
