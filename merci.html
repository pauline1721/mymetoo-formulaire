<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UNIS - Merci</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#eee6f2;
  font-family:Georgia, serif;
}

/* =========================
   PAGE
========================= */

.page{
  width:100%;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  padding:15px;
}


/* =========================
   GRAND VISUEL
========================= */

.visual{
  position:relative;

  width:100%;
  max-width:1000px;

  margin:0 auto;

  overflow:hidden;

  border-radius:18px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.12);
}


/* =========================
   IMAGE MERCI
========================= */

.merci-image{
  display:block;

  width:100%;
  height:auto;

  margin:0;
}


/* =========================
   LOGO PAR-DESSUS L'IMAGE
========================= */

.logo-unis{
  position:absolute;

  top:2.2%;
  left:50%;

  transform:translateX(-50%);

  width:190px;
  height:auto;

  z-index:5;
}


/* =========================
   BOUTONS DANS L'IMAGE
========================= */

.buttons{
  position:absolute;

  left:50%;
  bottom:3%;

  transform:translateX(-50%);

  width:76%;
  max-width:700px;

  display:flex;
  flex-direction:column;

  gap:12px;

  z-index:5;
}


/* =========================
   STYLE DES BOUTONS
========================= */

.btn{
  display:block;

  width:100%;

  padding:15px 20px;

  border:1px solid rgba(126,94,54,.28);
  border-radius:15px;

  background:rgba(247,231,201,.94);

  color:#60451f;

  font-family:Georgia, serif;
  font-size:20px;
  font-weight:bold;

  text-decoration:none;
  text-align:center;

  cursor:pointer;

  box-shadow:
    0 3px 12px rgba(0,0,0,.08);

  backdrop-filter:blur(3px);

  transition:
    transform .15s ease,
    background .15s ease;
}


.btn:hover{
  transform:translateY(-1px);

  background:
    rgba(252,239,215,.98);
}


button.btn{
  appearance:none;
  -webkit-appearance:none;
}


/* =========================
   BLOG
========================= */

#blogBtn{
  display:none;
}


/* =========================
   MESSAGE FERMETURE
========================= */

.close-message{
  display:none;

  padding:9px 12px;

  border-radius:10px;

  background:rgba(255,255,255,.90);

  color:#684f36;

  font-family:Arial, sans-serif;
  font-size:13px;
  font-weight:600;

  text-align:center;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .page{
    padding:0;
  }

  .visual{
    max-width:none;
    border-radius:0;
    box-shadow:none;
  }

  .logo-unis{
    width:130px;
    top:2%;
  }

  .buttons{
    width:88%;
    bottom:2.5%;
    gap:8px;
  }

  .btn{
    padding:12px 10px;
    border-radius:12px;
    font-size:15px;
  }

}


/* =========================
   PETITS TÉLÉPHONES
========================= */

@media(max-width:420px){

  .logo-unis{
    width:110px;
  }

  .buttons{
    width:90%;
    bottom:2%;
  }

  .btn{
    padding:10px 8px;
    font-size:14px;
  }

}

</style>

</head>


<body>


<main class="page">


  <div class="visual">


    <!-- =========================
         IMAGE
    ========================= -->

    <img
      src="merci.png"
      class="merci-image"
      alt="Ta voix est là. Merci d’avoir été là."
    >


    <!-- =========================
         LOGO DANS LE VISUEL
    ========================= -->

    <img
      src="logoUNIS.png"
      class="logo-unis"
      alt="UNIS"
    >


    <!-- =========================
         BOUTONS DANS LE VISUEL
    ========================= -->

    <div class="buttons">


      <!-- BOUTON 1 -->

      <button
        type="button"
        class="btn"
        id="closeBtn"
      >
        Tu peux maintenant refermer cette page
      </button>


      <!-- BOUTON 2 -->

      <a
        href="temoignages.html"
        class="btn"
      >
        Découvrir les témoignages
      </a>


      <!-- BOUTON 3
           uniquement si compte blog créé
      -->

      <a
        href="blog.html"
        class="btn"
        id="blogBtn"
      >
        Accéder au blog
      </a>


      <div
        class="close-message"
        id="closeMessage"
      >
        Ton navigateur ne permet pas de fermer automatiquement cette page.
        Tu peux simplement fermer cet onglet.
      </div>


    </div>


  </div>


</main>


<script>


/* =========================
   BOUTON BLOG
========================= */

const blogCreated =
  sessionStorage.getItem("blogCreated") === "true";


const blogBtn =
  document.getElementById("blogBtn");


if(blogCreated){

  blogBtn.style.display =
    "block";

}


/* =========================
   FERMER LA PAGE
========================= */

const closeBtn =
  document.getElementById("closeBtn");


const closeMessage =
  document.getElementById("closeMessage");


closeBtn.addEventListener(
  "click",
  () => {


    window.close();


    setTimeout(
      () => {

        closeMessage.style.display =
          "block";

      },
      300
    );


  }
);


</script>


</body>

</html>
